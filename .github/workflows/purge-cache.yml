name: Purge Vercel Cache

on:
  deployment_status: # Fires when Vercel finishes deploying code

jobs:
  purge:
    # Runs on successful Production or Preview deployments (any casing Vercel may send)
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(fromJSON('["Production","production","Preview","preview"]'), github.event.deployment_status.environment)
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Purge CDN Cache
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel cache purge --type cdn --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"

      - name: Purge Data Cache
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel cache purge --type data --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"
